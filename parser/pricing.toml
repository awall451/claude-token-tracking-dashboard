# Anthropic first-party API list prices, USD per million tokens.
# Source: claude-api reference bundled with Claude Code 2.1.285 (model table cached 2026-09-25):
#   https://platform.claude.com/docs/en/about-claude/pricing
# Cache writes: 5-minute TTL = 1.25x input, 1-hour TTL = 2x input. Cache reads are per model
# (≈0.1x input; 0.05x on Opus 5.5, 0.025x on Fable 5.1).
# Checked against Claude Code's own cost-state: a Fable 5.1 session with 1h cache writes
# prices to $71.3 vs $71.29 reported.
#
# Models are matched by substring of the model id; first match wins (so list specific
# versions before their family). Override with PRICING_CONFIG=/path/to/your.toml.

cache_write_5m_multiplier = 1.25
cache_write_1h_multiplier = 2.0

[models]
"<synthetic>"      = { input = 0,  output = 0,  cache_read = 0 }
"claude-fable-5-1" = { input = 10, output = 50, cache_read = 0.25 }
"claude-mythos-5-1" = { input = 10, output = 50, cache_read = 0.25 }
"claude-fable-5"   = { input = 10, output = 50, cache_read = 1.0 }
"claude-mythos-5"  = { input = 10, output = 50, cache_read = 1.0 }
"claude-opus-5-5"  = { input = 4,  output = 20, cache_read = 0.20 }
"claude-opus-5"    = { input = 5,  output = 25, cache_read = 0.50 }
"claude-opus-4"    = { input = 5,  output = 25, cache_read = 0.50 }
"claude-sonnet-5"  = { input = 2,  output = 10, cache_read = 0.20 }
"claude-sonnet-4"  = { input = 3,  output = 15, cache_read = 0.30 }
"claude-haiku-4"   = { input = 1,  output = 5,  cache_read = 0.10 }
# Unknown / unrecognized models (and backfill rows with model "unknown") price as Opus 5.5.
default            = { input = 4,  output = 20, cache_read = 0.20 }
