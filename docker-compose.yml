services:
  claude-token-tracker:
    build: .
    ports:
      - "127.0.0.1:9420:9420"
    volumes:
      - ~/.claude:/data/.claude:ro
      - ~/.claude.json:/data/.claude.json:ro
      - ./frontend:/app/frontend:ro
      - ~/.config/claude-token-tracker:/data/config:ro
    environment:
      CLAUDE_DIR: /data/.claude
      STATS_PATH: /data/stats.json
      TAGS_CONFIG: /data/config/tags.toml
      HOME_DIR: ${HOME}   # host home: `~` in tags.toml and transcripts
      REFRESH_INTERVAL: 60   # seconds between auto-refresh
      PORT: 9420
    restart: unless-stopped
